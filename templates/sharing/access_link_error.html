<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title }} - Secure File Sharing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="auth-wrapper">
    <div class="auth-card text-center" style="max-width: 460px;">
        <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-3 bg-danger bg-opacity-25 border border-danger">
            <i class="bi bi-shield-x text-danger fs-1"></i>
        </div>
        <h4 class="fw-bold mb-2">{{ error_title }}</h4>
        <p class="text-secondary small mb-4">{{ error_message }}</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-info btn-sm">
            <i class="bi bi-house me-1"></i> Return to Home
        </a>
    </div>
</body>
</html>
